server:
  port: ${SIMULATOR_SERVER_PORT:8080}

spring:
  application:
    name: hvac-simulator-platform

mqtt:
  delivery:
    enabled: ${MQTT_DELIVERY_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    client-id: ${MQTT_CLIENT_ID:hvac-simulator-gaia11}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    topic: ${MQTT_TOPIC:device/data/up}
